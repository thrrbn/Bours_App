services:
  db:
    image: postgres:18
    container_name: bourse_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-bourse_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bourse_pass}
      POSTGRES_DB: ${POSTGRES_DB:-bourse}
      POSTGRES_HOST_AUTH_METHOD: md5
      POSTGRES_INITDB_ARGS: "--auth-host=md5"
    ports:
      - "5432:5432"
    volumes:
      # Depuis Postgres 18, l'image officielle attend un mount sur le dossier
      # PARENT /var/lib/postgresql (pas /var/lib/postgresql/data) : elle range
      # elle-meme les donnees dans une sous-arborescence versionnee par majeure
      # (convention pg_ctlcluster, pour permettre pg_upgrade --link plus tard).
      # Voir https://github.com/docker-library/postgres/pull/1259
      - bourse_pgdata:/var/lib/postgresql
      # Scripts executes UNE SEULE FOIS, uniquement si le volume est vide
      # (bootstrap initial - voir db/migrations/001_init.sql). Les evolutions
      # ulterieures du schema passent par Alembic (backend/alembic/), pas par ce dossier.
      - ./db/migrations:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-bourse_user} -d ${POSTGRES_DB:-bourse}"]
      interval: 5s
      timeout: 5s
      retries: 10

  pgadmin:
    image: dpage/pgadmin4
    container_name: bourse_pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-admin@bourse.be}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:-admin}
    ports:
      - "5051:80"
    depends_on:
      - db

  backend:
    build: ./backend
    container_name: bourse_backend
    restart: unless-stopped
    ports:
      - "8001:8000"
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      DB_USER: ${POSTGRES_USER:-bourse_user}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-bourse_pass}
      DB_NAME: ${POSTGRES_DB:-bourse}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-changeme-generate-a-real-secret}
      MAIL_ENABLED: ${MAIL_ENABLED:-false}
      MAIL_SERVER: ${MAIL_SERVER:-smtp.gmail.com}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USER: ${MAIL_USER:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_FROM: ${MAIL_FROM:-}
      NOTIFY_EMAIL: ${NOTIFY_EMAIL:-}
    volumes:
      - ./backend:/app

  frontend:
    build: ./frontend
    container_name: bourse_frontend
    restart: unless-stopped
    ports:
      - "5174:5173"
    environment:
      # Dans le reseau Docker, le backend n'est pas joignable via "localhost"
      # mais via le nom du service ("backend"). Voir frontend/vite.config.js.
      VITE_API_TARGET: http://backend:8000
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend

volumes:
  bourse_pgdata:
